name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Configure Android SDK (pre-installed on runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null 2>&1 || true
          echo "SDK setup complete"

      - name: Install JS dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Install Capacitor packages
        run: bun add -D @capacitor/cli @capacitor/core @capacitor/android @capacitor/status-bar @capacitor/splash-screen

      - name: Build Next.js static export
        run: |
          # Backup and swap config for static export
          cp next.config.ts next.config.ts.bak
          cat > next.config.ts <<'EOF'
          import type { NextConfig } from "next";
          const nextConfig: NextConfig = {
            output: "export",
            images: { unoptimized: true },
            typescript: { ignoreBuildErrors: true },
            reactStrictMode: false,
            trailingSlash: true,
          };
          export default nextConfig;
          EOF
          # Capacitor APK doesn't need API routes - they break static export.
          # The client-side Agnes engine (src/lib/agnes/engine.ts) auto-detects
          # Capacitor env and uses rule engine instead of /api/agnes.
          mkdir -p /tmp/simos-api-backup
          cp -r src/app/api /tmp/simos-api-backup/
          rm -rf src/app/api
          # Build (use npx next build directly - package.json build script targets standalone, not export)
          npx next build
          # Restore config and api
          rm -f next.config.ts
          mv next.config.ts.bak next.config.ts
          cp -r /tmp/simos-api-backup/api src/app/api

      - name: Verify export output
        run: ls -la out/

      - name: Add Android platform
        run: |
          npx cap add android || true
          npx cap copy android

      - name: Inject immersive MainActivity
        run: |
          mkdir -p android/app/src/main/java/com/simos/scamsim
          cat > android/app/src/main/java/com/simos/scamsim/MainActivity.java <<'JAVA'
          package com.simos.scamsim;

          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.os.Build;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsControllerCompat;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  // Edge-to-edge 全螢幕沉浸式
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_TRANSLUCENT_STATUS);

                  WindowInsetsControllerCompat controller = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                  if (controller != null) {
                      controller.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                  }
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus && Build.VERSION.SDK_INT >= 19) {
                      View decorView = getWindow().getDecorView();
                      int flags = View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY;
                      decorView.setSystemUiVisibility(flags);
                  }
              }
          }
          JAVA
          # 確認 AndroidManifest 指向正確的 MainActivity
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if [ -f "$MANIFEST" ]; then
            # 確保使用 NoActionBar 主題
            sed -i 's|android:theme="@style/AppTheme.NoActionBarLaunch"|android:theme="@style/AppTheme.NoActionBarLaunch"|g' "$MANIFEST" || true
          fi
          # 加入全螢幕樣式
          STYLES=android/app/src/main/res/values/styles.xml
          if [ -f "$STYLES" ]; then
            cat > "$STYLES" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:windowBackground">@color/black</item>
                  <item name="android:statusBarColor">@android:color/black</item>
                  <item name="android:navigationBarColor">@android:color/black</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowContentOverlay">@null</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme">
                  <item name="android:background">@color/black</item>
              </style>
          </resources>
          XML
            # 確保 black color 存在
            COLORS=android/app/src/main/res/values/colors.xml
            if [ ! -f "$COLORS" ]; then
              cat > "$COLORS" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="black">#FF000000</color>
              <color name="white">#FFFFFFFF</color>
              <color name="colorPrimary">#000000</color>
              <color name="colorPrimaryDark">#000000</color>
              <color name="colorAccent">#000000</color>
              <color name="ic_launcher_background">#000000</color>
          </resources>
          XML
            fi
          fi

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon -x lint

      - name: Sign APK (if keystore present)
        if: env.SIGNING_KEY_BASE64 != ''
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$SIGNING_KEY_BASE64" | base64 -d > /tmp/release.keystore
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/app-unsigned.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks /tmp/release.keystore \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass pass:"$KEY_PASSWORD" \
            --out /tmp/app-release.apk \
            /tmp/app-unsigned.apk

      - name: Determine version & rename APK
        id: version
        run: |
          # 從 tag、push 或 run number 推導版本號
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="1.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Build version: $VERSION"

          mkdir -p artifacts
          if [ -f /tmp/app-release.apk ]; then
            cp /tmp/app-release.apk "artifacts/SimOS_v${VERSION}.apk"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk "artifacts/SimOS_v${VERSION}.apk"
          fi
          ls -la artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimOS-APK-v${{ steps.version.outputs.version }}
          path: artifacts/*.apk
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          name: SimOS v${{ steps.version.outputs.version }}
          files: artifacts/*.apk
          generate_release_notes: true
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
