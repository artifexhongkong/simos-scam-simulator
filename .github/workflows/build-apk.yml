name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Configure Android SDK (pre-installed on runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null 2>&1 || true
          echo "SDK setup complete"

      - name: Install JS dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Install Capacitor packages
        run: bun add -D @capacitor/cli @capacitor/core @capacitor/android @capacitor/status-bar @capacitor/splash-screen

      - name: Build Next.js static export
        run: |
          # Backup and swap config for static export
          cp next.config.ts next.config.ts.bak
          cat > next.config.ts <<'EOF'
          import type { NextConfig } from "next";
          const nextConfig: NextConfig = {
            output: "export",
            images: { unoptimized: true },
            typescript: { ignoreBuildErrors: true },
            reactStrictMode: false,
            trailingSlash: true,
          };
          export default nextConfig;
          EOF
          # Capacitor APK doesn't need API routes - they break static export.
          # The client-side Agnes engine (src/lib/agnes/engine.ts) auto-detects
          # Capacitor env and uses rule engine instead of /api/agnes.
          mkdir -p /tmp/simos-api-backup
          cp -r src/app/api /tmp/simos-api-backup/
          rm -rf src/app/api
          # Build (use npx next build directly - package.json build script targets standalone, not export)
          npx next build
          # Restore config and api
          rm -f next.config.ts
          mv next.config.ts.bak next.config.ts
          cp -r /tmp/simos-api-backup/api src/app/api

      - name: Verify export output
        run: ls -la out/

      - name: Add Android platform
        run: |
          npx cap add android || true
          npx cap copy android

      - name: Inject immersive MainActivity
        run: |
          mkdir -p android/app/src/main/java/com/simos/scamsim
          cat > android/app/src/main/java/com/simos/scamsim/MainActivity.java <<'JAVA'
          package com.simos.scamsim;

          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.os.Build;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import androidx.core.view.WindowInsetsCompat;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  // Edge-to-edge：內容延伸到系統列下方
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);

                  // 隱藏系統狀態列與導航列（沉浸式，參考 cultivation-world-zh）
                  WindowInsetsControllerCompat controller = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                  if (controller != null) {
                      controller.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                      controller.hide(WindowInsetsCompat.Type.systemBars());
                  }
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  // 重新取得焦點時再次隱藏系統列
                  if (hasFocus) {
                      WindowInsetsControllerCompat controller = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                      if (controller != null) {
                          controller.hide(WindowInsetsCompat.Type.systemBars());
                      }
                  }
              }
          }
          JAVA
          # 確認 AndroidManifest 設定 windowSoftInputMode=adjustResize
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "windowSoftInputMode" "$MANIFEST"; then
              sed -i 's|android:exported="true">|android:exported="true"\n            android:windowSoftInputMode="adjustResize">|' "$MANIFEST" || true
            fi
          fi
          # 加入全螢幕樣式
          STYLES=android/app/src/main/res/values/styles.xml
          if [ -f "$STYLES" ]; then
            cat > "$STYLES" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:statusBarColor">@android:color/black</item>
                  <item name="android:navigationBarColor">@android:color/black</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowContentOverlay">@null</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme">
                  <item name="android:background">@android:color/black</item>
              </style>
          </resources>
          XML
            # 確保 black color 存在，但不覆蓋 ic_launcher_background（避免與現有資源衝突）
            COLORS=android/app/src/main/res/values/colors.xml
            if [ ! -f "$COLORS" ]; then
              cat > "$COLORS" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="black">#FF000000</color>
              <color name="white">#FFFFFFFF</color>
          </resources>
          XML
            else
              # 若已存在，只補上 black / white（不動 ic_launcher_background）
              if ! grep -q 'name="black"' "$COLORS"; then
                sed -i 's|</resources>|    <color name="black">#FF000000</color>\n</resources>|' "$COLORS"
              fi
              if ! grep -q 'name="white"' "$COLORS"; then
                sed -i 's|</resources>|    <color name="white">#FFFFFFFF</color>\n</resources>|' "$COLORS"
              fi
            fi
          fi

      - name: Build Android Debug APK
        working-directory: android
        env:
          # 使用 GitHub run number 作為 versionCode（每次自動遞增）
          # 解決「APK 安裝衝突」問題：Android 要求 versionCode 必須比已安裝版本大
          SIMOS_VERSION_CODE: ${{ github.run_number }}
          SIMOS_VERSION_NAME: "1.${{ github.run_number }}"
        run: |
          chmod +x ./gradlew

          # 動態注入 versionCode / versionName 到 app/build.gradle
          # 確保每次 build 都有遞增的 versionCode，避免安裝衝突
          APP_GRADLE=app/build.gradle
          if [ -f "$APP_GRADLE" ]; then
            # 替換 versionCode 與 versionName
            sed -i "s/versionCode [0-9]*/versionCode ${SIMOS_VERSION_CODE}/g" "$APP_GRADLE"
            sed -i "s/versionName \"[^\"]*\"/versionName \"${SIMOS_VERSION_NAME}\"/g" "$APP_GRADLE"
            echo "Updated versionCode=${SIMOS_VERSION_CODE}, versionName=${SIMOS_VERSION_NAME}"
            grep -E "versionCode|versionName" "$APP_GRADLE" | head -4
          fi

          ./gradlew assembleDebug --no-daemon -x lint

      - name: Sign APK with fixed debug keystore (consistent across builds)
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk

          # 生成固定的 debug keystore（每次用相同參數，確保簽名一致）
          # 這樣每次 build 的 APK 簽名都相同，可以正常升級安裝
          keytool -genkeypair -v \
            -keystore /tmp/simos-debug.keystore \
            -alias simos-debug \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass simos123 \
            -keypass simos123 \
            -dname "CN=SimOS Debug, OU=Dev, O=SimOS, L=HK, ST=HK, C=HK"

          # 用固定 keystore 簽名 APK
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks /tmp/simos-debug.keystore \
            --ks-pass pass:simos123 \
            --ks-key-alias simos-debug \
            --key-pass pass:simos123 \
            --out /tmp/app-signed.apk \
            "$APK"
          cp /tmp/app-signed.apk "$APK"
          echo "APK signed with fixed debug keystore (consistent across all builds)"

      - name: Determine version & rename APK
        id: version
        run: |
          # 從 tag、push 或 run number 推導版本號
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="1.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Build version: $VERSION"

          mkdir -p artifacts
          # 直接用已簽名的 debug APK（已在上一步驟重新簽名）
          cp android/app/build/outputs/apk/debug/app-debug.apk "artifacts/SimOS_v${VERSION}.apk"
          ls -la artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimOS-APK-v${{ steps.version.outputs.version }}
          path: artifacts/*.apk
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          name: SimOS v${{ steps.version.outputs.version }}
          files: artifacts/*.apk
          generate_release_notes: true
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
